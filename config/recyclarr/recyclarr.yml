# Recyclarr — keeps quality profiles in line with TRaSH Guides community
# guidance, so nobody has to tune scoring by hand.
#
# Instances are reached over the Compose network by service name and *container*
# port, not the published loopback port — Recyclarr runs beside them, not on the
# host.
#
# Each instance's address and key are written by lemonfiber's adapter when it is
# told which preset a curator is held to: the address here, the key into
# secrets.yml beside this file, named by `!secret`. Until then each key there is
# blank, and Recyclarr skips an instance whose key is blank.
#
# Recyclarr is in the `tuning` profile and the *arrs are not. Running `tuning`
# without `tv` is legal and simply means Sonarr is unreachable that cycle; the
# next scheduled sync picks it up.
#
# What each instance asks the guides for lives in ./includes, one file per
# quality preset, rather than being fetched from a template repository at run
# time. Recyclarr's own templates are whole configurations meant to be copied,
# and the include registry they used to be reachable through no longer exists.
#
# Instance names are unique across the whole file, not per service: two called
# `main` are rejected as duplicates, and the config is skipped entirely.

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key

    include:
      - config: /config/includes/sonarr-web-1080p.yml

radarr:
  films:
    base_url: http://radarr:7878
    api_key: !secret radarr_api_key

    include:
      - config: /config/includes/radarr-hd-bluray-web.yml
