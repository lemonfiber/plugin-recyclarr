[package]
name = "recyclarr-adapter"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-recyclarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's quality.sync contract in front of Recyclarr, through the configuration it reads"
publish = false

[[bin]]
name = "recyclarr-adapter"
path = "src/main.rs"

[dependencies]
hex = "0.4"
sha2 = "0.11"
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb0fa09ab41c727a908129c2c6edbc1b4e1cb17c" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb0fa09ab41c727a908129c2c6edbc1b4e1cb17c" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb0fa09ab41c727a908129c2c6edbc1b4e1cb17c" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb0fa09ab41c727a908129c2c6edbc1b4e1cb17c" }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
toml = "1.1"
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb0fa09ab41c727a908129c2c6edbc1b4e1cb17c" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
