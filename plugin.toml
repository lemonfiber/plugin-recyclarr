schema_version = 1

[plugin]
id          = "recyclarr"
name        = "Recyclarr"
version     = "1.0.0"
description = "Keeps quality settings in line with community guidance"
without_it  = "Tune quality profiles by hand"
upstream    = "https://github.com/recyclarr/recyclarr"
license     = "MIT"
forms       = ["auto", "full"]

[[service]]
id          = "recyclarr"
name        = "Recyclarr"
image       = "ghcr.io/recyclarr/recyclarr"
digest      = "sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9"
tag         = "8.7.3"
health      = { kind = "container" }
criticality = "enhancing"
memory_mib  = 100
reaches     = "the community quality-guide repository"
asks_for    = "Syncs the quality profiles on its own schedule — its own errand, not one anything else here sets off."
user_mode   = "uid"
replaces    = "recyclarr"
provides    = ["quality.sync"]

[service.env]
CRON_SCHEDULE  = { setting = "recyclarr:cron", default = "@daily" }
SONARR_API_KEY = { secret = "tv-key" }
RADARR_API_KEY = { secret = "movies-key" }

[[secret]]
id  = "tv-key"
of  = "sonarr"
why = "Write the television curator's quality profiles"

[[secret]]
id  = "movies-key"
of  = "radarr"
why = "Write the film curator's quality profiles"

[[proof]]
id      = "recyclarr.version"
title   = "Recyclarr's own program says which release it is"
run     = { args = ["--version"] }
expect  = { exit = 0, stdout_starts_with = "v8.7.3 (" }
fixture = "recordings/recyclarr/version.json"
why     = """
Recyclarr answers nothing over a port: it runs its sync on its own schedule
and writes quality profiles into the curators it is pointed at. The one
thing it can be asked is its own program. Run with `--version`, it names the
release it was built from, which says the pinned image is Recyclarr at the
release this manifest names.
"""


[[ask]]
capability = "library.curate"
each       = true

[[claim]]
capability = "quality.sync"

[[claim.probe]]
id      = "runs"
run     = { args = ["--version"] }
expect  = { exit = 0, stdout_starts_with = "v8.7.3 (" }
fixture = "recordings/recyclarr/quality-sync-runs.json"
